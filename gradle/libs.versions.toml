[versions]
agp = "8.3.2"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.8.6"
cameraX = "1.3.4"
firebaseAuth = "24.0.1"
okhttp = "4.12.0"
